; Péndulo invertido lineal (ESP32 + stepper)
;
; Un entorno por fase del plan de pruebas. Cada uno compila solo su carpeta de src/
; y todos usan los mismos módulos de lib/ (config, encoder, motor, control).
; Las Fases 3, 4 y 5 son el mismo programa (src/control/); solo cambia FASE.

[platformio]
default_envs = fase1_encoder

; Configuración común
[esp32]
; espressif32 6.x trae Arduino-ESP32 2.0.x
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; send_on_enter: los comandos se mandan al presionar Enter. monitor_echo: ver lo que escribes.
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7
    gin66/FastAccelStepper@^0.31.3

[env:fase1_encoder]
extends = esp32
build_src_filter = +<fase1_encoder/>

[env:fase2_stepper]
extends = esp32
build_src_filter = +<fase2_stepper/>

[env:fase3_control_sin_motor]
extends = esp32
build_src_filter = +<control/>
build_flags = -D FASE=3

[env:fase4_signo]
extends = esp32
build_src_filter = +<control/>
build_flags = -D FASE=4

[env:fase5_lazo_cerrado]
extends = esp32
build_src_filter = +<control/>
build_flags = -D FASE=5
